<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PyData Prayagraj — Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages & Custom Domain (handles /mainuser, /events, /team, etc.)
      (function() {
        var path = window.location.pathname;
        var repoName = '/Pydata_Prayagraj';
        var isSubpath = path.startsWith(repoName);
        var base = isSubpath ? repoName : '';
        var route = isSubpath ? path.substring(repoName.length) : path;
        
        if (!route || route === '/') {
          route = '/';
        }
        
        var targetUrl = window.location.origin + base + '/#' + route + window.location.search + window.location.hash;
        window.location.replace(targetUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
